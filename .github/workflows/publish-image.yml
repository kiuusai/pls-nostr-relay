name: Publish Docker image

on:
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select image tags
        id: tags
        uses: actions/github-script@v7
        with:
          script: |
            const currentTag = context.payload.release.tag_name;
            const { data: latestRelease } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const image = `docker.io/${process.env.DOCKERHUB_USERNAME}/${process.env.DOCKERHUB_REPOSITORY}`;
            const tags = [`${image}:${currentTag}`];
            if (latestRelease.tag_name === currentTag) {
              tags.push(`${image}:latest`);
            }
            core.setOutput('tags', tags.join('\n'));
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
